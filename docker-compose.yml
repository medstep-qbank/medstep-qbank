services:
  qbank:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"   # снаружи сайт отдаёт Caddy/Nginx с HTTPS
    env_file: .env
    environment:
      DATA_DIR: /data   # внутри контейнера база всегда в томе /data
      PORT: 3000
    volumes:
      - qbank-data:/data

volumes:
  qbank-data:
