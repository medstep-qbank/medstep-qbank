# Render Blueprint (бесплатное демо).
# Free-план: без постоянного диска — база создаётся заново при каждом перезапуске
# (демо-вопросы и администратор восстанавливаются автоматически). Для настоящих
# студентов смените plan на starter и добавьте блок disk (см. README).
services:
  - type: web
    name: medstep-qbank
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /data
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: SITE_NAME
        value: MedStep
      - key: SEED_DEMO
        value: "1"
      - key: DEMO_MODE
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
